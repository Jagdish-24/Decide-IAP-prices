<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PlayPrice Automator</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #080D1A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1E293B;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo {
      font-size: 24px;
      line-height: 1;
    }
    .title {
      font-weight: 700;
      color: #38BDF8;
      font-size: 14px;
      letter-spacing: 0.2px;
    }
    .sub {
      color: #94A3B8;
      font-size: 11px;
      margin-top: 1px;
    }
    .card {
      background: #0F172A;
      border: 1px solid #1E293B;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 14px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #10B981;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.5);
    }
    .shortcut-tag {
      background: #1E293B;
      color: #94A3B8;
      font-size: 10px;
      font-family: Consolas, monospace;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #334155;
    }
    .guide-step {
      display: flex;
      gap: 8px;
      margin-bottom: 6px;
      color: #CBD5E1;
      font-size: 11px;
      line-height: 1.4;
    }
    .guide-step:last-child {
      margin-bottom: 0;
    }
    .step-num {
      color: #38BDF8;
      font-weight: 700;
    }
    .btn-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      background: linear-gradient(135deg, #0284C7, #0EA5E9);
      color: #FFFFFF;
      font-weight: 700;
      font-size: 13px;
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(2, 132, 199, 0.35);
      transition: all 0.2s ease;
    }
    .btn-toggle:hover {
      background: linear-gradient(135deg, #0369A1, #0284C7);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.5);
      transform: translateY(-1px);
    }
    .btn-toggle:active {
      transform: translateY(0);
    }
    .feedback-msg {
      margin-top: 10px;
      font-size: 11px;
      text-align: center;
      color: #94A3B8;
      min-height: 16px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">⚡</div>
    <div>
      <div class="title">PlayPrice Automator</div>
      <div class="sub">Google Play Console DOM Robot • v1.7.8</div>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>Extension Active</span>
      </div>
      <span class="shortcut-tag">Alt + P</span>
    </div>
    <div class="guide-step">
      <span class="step-num">1.</span>
      <span>Open any Google Play Console <em>Edit sale</em> or <em>Pricing</em> page.</span>
    </div>
    <div class="guide-step">
      <span class="step-num">2.</span>
      <span>Use the button below or press <strong>Alt + P</strong> to Show or Hide the robot panel.</span>
    </div>
    <div class="guide-step">
      <span class="step-num">3.</span>
      <span>Select <strong>App Price</strong> or <strong>App Sale Price</strong>, drop CSV, and Start!</span>
    </div>
  </div>

  <button class="btn-toggle" id="btnTogglePanel">
    <span>⚡ Show / Hide Automator Panel</span>
  </button>

  <div class="feedback-msg" id="popupFeedback"></div>

  <script src="popup.js"></script>
</body>
</html>
